<div class="auth-form">
  <h2>Welcome back</h2>
  <p class="muted">Log in with your mobile number or email.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field class="full-width">
      <mat-label>Mobile number or email</mat-label>
      <input matInput formControlName="identifier" autocomplete="username" />
      <mat-error>Enter your mobile number or email</mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Password</mat-label>
      <input
        matInput
        formControlName="password"
        autocomplete="current-password"
        [type]="hidePassword() ? 'password' : 'text'"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
        (click)="hidePassword.set(!hidePassword())"
      >
        <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <mat-error>Enter your password</mat-error>
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button mat-flat-button class="full-width submit">Log in</button>
  </form>

  <p class="switch">
    New here? <a routerLink="/auth/register">Create an employee account</a>
  </p>

  <div class="demo">
    Demo logins:
    @for (account of demoAccounts; track account.label) {
      <button mat-button type="button" (click)="fillDemo(account)">{{ account.label }}</button>
    }
  </div>
</div>
