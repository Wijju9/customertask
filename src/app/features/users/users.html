<div class="page">
  <div class="page-header">
    <h2>Users</h2>
    <button mat-flat-button (click)="addEmployee()"><mat-icon>add</mat-icon> Add employee</button>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="users()">
        <ng-container matColumnDef="mobile">
          <th mat-header-cell *matHeaderCellDef>Mobile</th>
          <td mat-cell *matCellDef="let user">{{ user.mobileNo }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let user">{{ roleName(user) }}</td>
        </ng-container>

        <ng-container matColumnDef="tasks">
          <th mat-header-cell *matHeaderCellDef>Tasks</th>
          <td mat-cell *matCellDef="let user">{{ taskCount(user) }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let user">
            <span class="status-pill" [class.status-done]="user.isActive">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let user" class="row-actions">
            @if (isMe(user)) {
              <span class="muted">You</span>
            } @else {
              <button mat-button (click)="toggleActive(user)">
                {{ user.isActive ? 'Deactivate' : 'Activate' }}
              </button>
              <button mat-button (click)="resetPassword(user)">Reset password</button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  </div>
</div>
