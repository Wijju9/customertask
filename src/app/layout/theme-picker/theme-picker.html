<button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Theme" aria-label="Change theme">
  <mat-icon>palette</mat-icon>
</button>

<mat-menu #menu="matMenu" class="theme-menu">
  <!-- Stop clicks from closing the menu so people can try several options. -->
  <div class="theme-panel" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <p class="heading">Mode</p>
    <mat-button-toggle-group
      aria-label="Colour mode"
      hideSingleSelectionIndicator
      [value]="theme.mode()"
      (change)="theme.setMode($event.value)"
    >
      @for (mode of modes; track mode.value) {
        <mat-button-toggle [value]="mode.value">
          <mat-icon>{{ mode.icon }}</mat-icon> {{ mode.label }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>

    <p class="heading">Colour</p>
    <div class="swatches" role="radiogroup" aria-label="Brand colour">
      @for (palette of palettes; track palette.id) {
        <button
          type="button"
          class="swatch"
          role="radio"
          [style.background]="palette.swatch"
          [class.selected]="theme.palette() === palette.id"
          [attr.aria-checked]="theme.palette() === palette.id"
          [attr.aria-label]="palette.label"
          [matTooltip]="palette.label"
          (click)="theme.setPalette(palette.id)"
        >
          @if (theme.palette() === palette.id) {
            <mat-icon>check</mat-icon>
          }
        </button>
      }
    </div>
  </div>
</mat-menu>
