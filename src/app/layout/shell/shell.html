<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
  >
    <div class="brand">FileDesk</div>

    <mat-nav-list>
      @for (link of links(); track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive
          #active="routerLinkActive"
          [activated]="active.isActive"
          (click)="closeOnMobile(sidenav)"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isMobile()) {
        <button mat-icon-button aria-label="Open menu" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>

      <app-theme-picker />

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <mat-icon>account_circle</mat-icon>
        <span class="user-email">{{ auth.currentUser()?.email }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info">
          <strong>{{ auth.currentUser()?.email }}</strong>
          <span class="muted">{{ auth.isAdmin() ? 'Admin' : 'Employee' }}</span>
        </div>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
